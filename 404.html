<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spherics · nos mudamos a spherics.cl</title>
<link rel="canonical" href="https://spherics.cl/">
<meta name="robots" content="noindex">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;min-height:100vh;
    background:radial-gradient(1200px 600px at 50% -10%,#15151f,#0a0a0c 60%);
    color:#e8e8ea;font:400 16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    text-align:center;padding:24px}
  .brand{display:inline-flex;align-items:center;gap:11px;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:24px;letter-spacing:.01em;margin-bottom:18px}
  .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#ffe27a,#f3b13a)}
  h1{font-size:20px;font-weight:600;margin:0 0 8px}
  p{color:#a0a0a8;margin:0 0 22px}
  a.cta{display:inline-block;background:linear-gradient(135deg,#ffe27a,#f3b13a);color:#1a1206;
    font-weight:700;text-decoration:none;padding:12px 22px;border-radius:12px}
  .small{margin-top:18px;font-size:13px;color:#6a6a72}
</style>
</head>
<body>
  <main>
    <div class="brand"><span class="dot"></span> Spherics</div>
    <h1>Nos mudamos a un dominio propio</h1>
    <p>Te estamos llevando a <strong>spherics.cl</strong>…</p>
    <a class="cta" href="https://spherics.cl/">Ir a spherics.cl</a>
    <div class="small">Si no eres redirigido automáticamente, haz clic en el botón.</div>
  </main>
  <script>
    // preserva la ruta vieja: /mundial-2026/probabilidades.html -> spherics.cl/probabilidades.html
    var p = location.pathname.replace(/^\/mundial-2026/, "");
    location.replace("https://spherics.cl" + p + location.search + location.hash);
  </script>
</body>
</html>
