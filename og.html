<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/styles.css">
<style>
html,body{margin:0} body{width:1200px;height:630px;overflow:hidden}
.og{width:1200px;height:630px;padding:60px 64px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(900px 500px at 80% -20%,#15120a,#08090c 60%),#08090c}
.og .brand{display:flex;align-items:center;gap:14px;font-family:'Space Grotesk';font-weight:700;font-size:26px;color:#eaf0ff}
.og .brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ffe27a,#f3b13a);box-shadow:0 0 24px rgba(243,177,58,.55)}
.og h1{font-family:'Space Grotesk';font-weight:700;font-size:72px;line-height:1.02;margin:0;color:#eaf0ff;max-width:18ch}
.og h1 .g{background:linear-gradient(135deg,#ffe27a,#f3b13a);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:18px}
.f{flex:1;background:#121319;border:1px solid #262835;border-radius:18px;padding:20px 22px;display:flex;align-items:center;gap:16px}
.f:first-child{border-color:#ffd24a88;box-shadow:0 0 0 1px #ffd24a33}
.f .fl{font-size:44px} .f .nm{font-family:'Space Grotesk';font-weight:600;font-size:24px;color:#eaf0ff;flex:1}
.f .pc{font-family:'Space Grotesk';font-weight:700;font-size:34px;color:#f2c14e} .f:first-child .pc{color:#ffd24a}
.tag{color:#9a96a4;font-size:22px}
</style></head><body><div class="og">
  <div class="brand"><span class="dot"></span> PG Lab</div>
  <h1>¿Quién gana el <span class="g">Mundial 2026</span>?</h1>
  <div class="row"><div class="f"><div class="fl">🇪🇸</div><div class="nm">España</div><div class="pc">17.0%</div></div><div class="f"><div class="fl">🇦🇷</div><div class="nm">Argentina</div><div class="pc">14.2%</div></div><div class="f"><div class="fl">🇫🇷</div><div class="nm">Francia</div><div class="pc">12.3%</div></div></div>
  <div class="tag">Probabilidad de campeón · 10,000 simulaciones · se actualiza cada 4 h</div>
</div></body></html>
